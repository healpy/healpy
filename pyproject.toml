[project]
name = "healpy"
description = "Healpix tools package for Python"
readme = "README.rst"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
]
authors = [
    { name = "C. Rosset", email = "cyrille.rosset@apc.univ-paris-diderot.fr" },
    { name = "A. Zonca" },
]
license = {text = "GPL-2.0-only"}
requires-python = ">=3.11"
dependencies = ["numpy>=2.0.0", "astropy"]
dynamic = ["version"]

[project.optional-dependencies]
all = ["matplotlib", "scipy"]
test = [
    "pytest",
    "pytest-astropy-header",
    "pytest-cython",
    "pytest-doctestplus",
    "requests",
    "matplotlib",
    "scipy",
]
doc = [
    "ipykernel",
    "matplotlib",
    "nbsphinx",
    "numpydoc",
    "sphinxnotebookgist",
    "sphinx>=6,<9",
    "sphinx-book-theme",
]

[project.urls]
homepage = "https://github.com/healpy/healpy"
source = "https://github.com/healpy/healpy"
download = "https://pypi.org/project/healpy/#files"
changelog = "https://github.com/healpy/healpy/blob/main/CHANGELOG.rst"
releasenotes = "https://github.com/healpy/healpy/releases"
documentation = "https://healpy.readthedocs.io"
issues = "https://github.com/healpy/healpy/issues"

[build-system]
build-backend = 'mesonpy'
requires = [
    "meson>=1.4.0",
    "meson-python>=0.14.0",
    "cython>=3.1",
    "numpy>=2.0.0",
    "setuptools_scm>=6.2",
]

[tool.cibuildwheel]
test-command = [
    "pytest --doctest-plus --doctest-cython --pyargs healpy",
    "pytest {project}/test"
]
test-extras = ["test"]

# Python 3.14t did not support the limited API, and Cython does not yet
# support the limited API on Python 3.15t (abi3t).
# See https://github.com/cython/cython/issues/7276
[[tool.cibuildwheel.overrides]]
select = "cp3??t-*"
inherit.config-settings = "append"
config-settings.setup-args = "-Dpython.allow_limited_api=false"

[tool.cibuildwheel.macos]
before-all = "brew install libomp"
environment = { MACOSX_DEPLOYMENT_TARGET="15.0" }

[tool.meson-python]
limited-api = true

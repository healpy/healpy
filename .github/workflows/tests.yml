name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly on Tuesday at 9 AM Pacific (16:00 UTC)
    - cron: '0 16 * * 2'

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}${{ matrix.astropy-prerelease && ' (astropy pre-release)' || '' }}
    runs-on: ${{ matrix.runs-on }}
    continue-on-error: ${{ matrix.astropy-prerelease }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        astropy-prerelease: [false]
        runs-on: [ubuntu-latest]
        include:
          - python-version: "3.12"
            astropy-prerelease: false
            runs-on: macos-latest
          - python-version: "3.12"
            astropy-prerelease: false
            runs-on: windows-latest
          - runs-on: ubuntu-latest
            python-version: "3.15"
            astropy-prerelease: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          key: ${{ runner.os }}-py${{ matrix.python-version }}
          max-size: 256M

      - name: Install pre-release dependencies
        if: matrix.astropy-prerelease
        run: pip install --extra-index-url https://pypi.anaconda.org/astropy/simple astropy --pre

      - name: Install build dependencies
        run: pip install $(python -c 'from tomllib import load; print(*load(open("pyproject.toml", "rb"))["build-system"]["requires"])')

      - name: Install package in editable mode
        env:
          CC: "ccache gcc"
          CXX: "ccache g++"
        run: pip install --no-build-isolation -e ".[test]"

      - name: Run doctests
        run: pytest --doctest-plus --doctest-cython --pyargs healpy

      - name: Run test suite
        run: pytest test/
